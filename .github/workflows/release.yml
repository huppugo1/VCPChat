name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'  # 触发条件：推送 v1.0.0 格式的标签
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      release_upload_url: ${{ steps.create-release.outputs.url }}
      release_version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version from tag
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          name: VCP New Chat v${{ steps.version.outputs.version }}
          body: |
            ## VCP New Chat v${{ steps.version.outputs.version }}
            
            ### 📦 下载说明
            
            请根据您的操作系统选择对应的安装包：
            
            #### Windows
            - `vcpnewchat_${{ steps.version.outputs.version }}_x64_portable.exe` - 绿色版（推荐，免安装直接运行）
            - `VCP Chat - tauri版v${{ steps.version.outputs.version }}_${{ steps.version.outputs.version }}_x64-setup.exe` - 安装程序
            
            #### Linux
            - `vcp-new-chat_${{ steps.version.outputs.version }}_amd64.deb` - Debian/Ubuntu 系统
            - `vcp-new-chat_${{ steps.version.outputs.version }}_amd64.AppImage` - 通用版（所有发行版）
            
            #### macOS
            - `VCP Chat - tauri版v${{ steps.version.outputs.version }}_x64.dmg` - Intel 芯片 Mac
            - `VCP Chat - tauri版v${{ steps.version.outputs.version }}_aarch64.dmg` - Apple Silicon (M1/M2/M3)
            
            ### ✨ 更新内容
            
            请查看 [CHANGELOG.md](./CHANGELOG.md) 了解详细更新内容。
            
            ### 📋 系统要求
            
            - **Windows**: Windows 10 (1809+) 或 Windows 11
              - 绿色版需要系统已安装 WebView2（Windows 11 自带）
            - **Linux**: 支持 GTK 3.24+ 的发行版
              - Ubuntu 22.04+, Debian 11+, Fedora 36+, Arch Linux 等
            - **macOS**: macOS 10.15 (Catalina) 或更高版本
            
            ### 🐛 问题反馈
            
            如遇到问题，请在 [Issues](../../issues) 中反馈。
            ### 运行目录结构:
              vcpnewchat.exe:客户端
              AppData:用户资源目录

              注意：
              1.AppData目录考到当前目录下
              2.assets目录放到AppData目录下
              3.styles目录放到AppData/assets目录下
          draft: false
          prerelease: false

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust: stable
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust: stable
          - platform: macos-latest
            target: x86_64-apple-darwin
            rust: stable
          - platform: macos-latest
            target: aarch64-apple-darwin
            rust: stable

    runs-on: ${{ matrix.platform }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Update bundle targets for platform
        shell: bash
        run: |
          VERSION="${{ needs.create-release.outputs.release_version }}"
          
          # 更新 Cargo.toml 中 [package] 部分的版本号（只替换第一个）
          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            powershell -Command "\$content = Get-Content src-tauri/Cargo.toml -Raw; \$content = \$content -replace '(?m)^version = \"[^\"]*\"', \"version = \`\"\$env:VERSION\`\"\" -replace 'first'; Set-Content src-tauri/Cargo.toml -Value \$content -NoNewline" -NoProfile
          else
            # 使用 awk 只替换 [package] 部分的第一个 version
            awk -v ver="$VERSION" '
              /^\[package\]/ { in_package=1 }
              /^\[/ && !/^\[package\]/ { in_package=0 }
              in_package && /^version = / && !replaced { 
                print "version = \"" ver "\""
                replaced=1
                next
              }
              { print }
            ' src-tauri/Cargo.toml > src-tauri/Cargo.toml.tmp
            mv src-tauri/Cargo.toml.tmp src-tauri/Cargo.toml
          fi
          
          # 更新版本号、产品名称和窗口标题
          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            powershell -Command "(Get-Content src-tauri/tauri.conf.json) -replace '\"version\": \"[^\"]*\"', '\"version\": \"$VERSION\"' | Set-Content src-tauri/tauri.conf.json"
            powershell -Command "(Get-Content src-tauri/tauri.conf.json) -replace '\"productName\": \"VCP Chat - tauri版v[^\"]*\"', '\"productName\": \"VCP Chat - tauri版v$VERSION\"' | Set-Content src-tauri/tauri.conf.json"
            powershell -Command "(Get-Content src-tauri/tauri.conf.json) -replace '\"title\": \"VCP Chat - tauri版v[^\"]*\"', '\"title\": \"VCP Chat - tauri版v$VERSION\"' | Set-Content src-tauri/tauri.conf.json"
          else
            sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
            sed -i.bak "s/\"productName\": \"VCP Chat - tauri版v[^\"]*\"/\"productName\": \"VCP Chat - tauri版v$VERSION\"/" src-tauri/tauri.conf.json
            sed -i.bak "s/\"title\": \"VCP Chat - tauri版v[^\"]*\"/\"title\": \"VCP Chat - tauri版v$VERSION\"/" src-tauri/tauri.conf.json
            rm -f src-tauri/tauri.conf.json.bak
          fi
          
          # 更新不同平台的打包目标
          if [ "${{ matrix.platform }}" == "ubuntu-22.04" ]; then
            # Linux: deb 和 AppImage
            sed -i.bak 's/"targets": \["nsis"\]/"targets": ["deb", "appimage"]/' src-tauri/tauri.conf.json
            rm -f src-tauri/tauri.conf.json.bak
          elif [ "${{ matrix.platform }}" == "macos-latest" ]; then
            # macOS: dmg 和 app
            sed -i.bak 's/"targets": \["nsis"\]/"targets": ["dmg", "app"]/' src-tauri/tauri.conf.json
            rm -f src-tauri/tauri.conf.json.bak
          fi
          
          echo "Updated for ${{ matrix.platform }} with version $VERSION"
          echo "=== Cargo.toml (first 20 lines) ==="
          head -n 20 src-tauri/Cargo.toml
          echo "=== tauri.conf.json ==="
          cat src-tauri/tauri.conf.json | grep -E '"version"|"productName"|"title"|"targets"'

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        id: build-tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

      - name: Rename and upload portable exe (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          # 复制并重命名绿色版
          cp src-tauri/target/${{ matrix.target }}/release/vcpnewchat.exe vcpnewchat_${{ needs.create-release.outputs.release_version }}_x64_portable.exe
          
          # 使用 gh CLI 上传
          gh release upload v${{ needs.create-release.outputs.release_version }} vcpnewchat_${{ needs.create-release.outputs.release_version }}_x64_portable.exe --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-release-notes:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate checksums
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \) -exec sha256sum {} \; > checksums.txt
          
      - name: Update release with checksums
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const checksums = fs.readFileSync('src-tauri/target/release/bundle/checksums.txt', 'utf8');
            
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              body: context.payload.release.body + '\n\n### 🔐 文件校验和\n\n```\n' + checksums + '\n```'
            });
