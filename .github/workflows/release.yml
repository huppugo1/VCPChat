name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'  # 触发条件：推送 v1.0.0 格式的标签
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      release_upload_url: ${{ steps.create-release.outputs.url }}
      release_version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version from tag
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          name: VCP New Chat v${{ steps.version.outputs.version }}
          body: |
            ## VCP New Chat v${{ steps.version.outputs.version }}
            
            ### 📦 下载说明
            
            请根据您的操作系统选择对应的安装包：
            
            #### Windows
            - `vcpnewchat_${{ steps.version.outputs.version }}_x64.exe` - 绿色版（推荐）
            - `vcpnewchat_${{ steps.version.outputs.version }}_x64_setup.exe` - 安装程序
            - `vcpnewchat_${{ steps.version.outputs.version }}_x64.msi` - MSI 安装包
            
            #### Linux
            - `vcpnewchat_${{ steps.version.outputs.version }}_amd64.deb` - Debian/Ubuntu
            - `vcpnewchat_${{ steps.version.outputs.version }}_amd64.AppImage` - 通用版
            
            #### macOS
            - `vcpnewchat_${{ steps.version.outputs.version }}_x64.dmg` - Intel 芯片
            - `vcpnewchat_${{ steps.version.outputs.version }}_aarch64.dmg` - Apple Silicon
            
            ### ✨ 更新内容
            
            请查看 [CHANGELOG.md](./CHANGELOG.md) 了解详细更新内容。
            
            ### 📋 系统要求
            
            - **Windows**: Windows 10 (1809+) 或 Windows 11
            - **Linux**: 支持 GTK 3.24+ 的发行版
            - **macOS**: macOS 10.15+
            
            ### 🐛 问题反馈
            
            如遇到问题，请在 [Issues](../../issues) 中反馈。
          draft: false
          prerelease: false

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust: stable
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust: stable
          - platform: macos-latest
            target: x86_64-apple-darwin
            rust: stable
          - platform: macos-latest
            target: aarch64-apple-darwin
            rust: stable

    runs-on: ${{ matrix.platform }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

      - name: Upload portable exe (Windows only)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.release_upload_url }}
          asset_path: src-tauri/target/${{ matrix.target }}/release/vcpnewchat.exe
          asset_name: vcpnewchat_${{ needs.create-release.outputs.release_version }}_x64_portable.exe
          asset_content_type: application/octet-stream

  update-release-notes:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate checksums
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \) -exec sha256sum {} \; > checksums.txt
          
      - name: Update release with checksums
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const checksums = fs.readFileSync('src-tauri/target/release/bundle/checksums.txt', 'utf8');
            
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              body: context.payload.release.body + '\n\n### 🔐 文件校验和\n\n```\n' + checksums + '\n```'
            });
