name: Android Release Build

# 注意：首次使用前需要在本地运行 'npm run android:init' 初始化 Android 项目
# 初始化后会生成 src-tauri/gen/android/ 目录，需要提交到仓库

on:
  push:
    tags:
      - 'v*.*.*-android'  # 只在推送 android 标签时触发，例如 v0.1.0-android
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if Android is initialized
        id: check-android
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "Android project not initialized!"
            echo "Please run 'npm run android:init' locally and commit the generated files."
            echo "initialized=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "initialized=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check-android.outputs.initialized == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        if: steps.check-android.outputs.initialized == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        if: steps.check-android.outputs.initialized == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Rust
        if: steps.check-android.outputs.initialized == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Rust Android targets
        if: steps.check-android.outputs.initialized == 'true'
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Install frontend dependencies
        if: steps.check-android.outputs.initialized == 'true'
        run: npm ci

      - name: Get version from tag
        if: steps.check-android.outputs.initialized == 'true'
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            VERSION=${VERSION%-android}  # 移除 -android 后缀
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Update version in mobile config
        if: steps.check-android.outputs.initialized == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 更新移动端配置文件的版本号
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.mobile.json
          sed -i "s/\"productName\": \"VCP Chat[^\"]*\"/\"productName\": \"VCP Chat v$VERSION\"/" src-tauri/tauri.conf.mobile.json
          echo "Updated mobile config with version $VERSION"

      - name: Build mobile frontend
        if: steps.check-android.outputs.initialized == 'true'
        run: npm run build:mobile

      - name: Copy mobile config
        if: steps.check-android.outputs.initialized == 'true'
        run: cp src-tauri/tauri.conf.mobile.json src-tauri/tauri.conf.json

      - name: Build Android APK
        if: steps.check-android.outputs.initialized == 'true'
        run: npm run tauri android build

      - name: Rename APK files
        if: steps.check-android.outputs.initialized == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd src-tauri/gen/android/app/build/outputs/apk
          
          # 重命名 universal APK
          if [ -f "universal/release/app-universal-release-unsigned.apk" ]; then
            mv universal/release/app-universal-release-unsigned.apk universal/release/vcpnewchat_${VERSION}_universal.apk
          fi
          
          # 重命名 arm64-v8a APK
          if [ -f "arm64-v8a/release/app-arm64-v8a-release-unsigned.apk" ]; then
            mv arm64-v8a/release/app-arm64-v8a-release-unsigned.apk arm64-v8a/release/vcpnewchat_${VERSION}_arm64-v8a.apk
          fi
          
          # 重命名 armeabi-v7a APK
          if [ -f "armeabi-v7a/release/app-armeabi-v7a-release-unsigned.apk" ]; then
            mv armeabi-v7a/release/app-armeabi-v7a-release-unsigned.apk armeabi-v7a/release/vcpnewchat_${VERSION}_armeabi-v7a.apk
          fi
          
          # 重命名 x86_64 APK
          if [ -f "x86_64/release/app-x86_64-release-unsigned.apk" ]; then
            mv x86_64/release/app-x86_64-release-unsigned.apk x86_64/release/vcpnewchat_${VERSION}_x86_64.apk
          fi

      - name: Upload APK to Release
        if: steps.check-android.outputs.initialized == 'true' && startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd src-tauri/gen/android/app/build/outputs/apk
          
          # 上传所有架构的 APK
          for arch in universal arm64-v8a armeabi-v7a x86_64; do
            if [ -f "$arch/release/vcpnewchat_${VERSION}_${arch}.apk" ]; then
              gh release upload v${VERSION}-android "$arch/release/vcpnewchat_${VERSION}_${arch}.apk" --clobber
              echo "Uploaded $arch APK"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
