<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主题选择</title>
    <!-- The main theme file is now loaded first to provide base variables -->
    <link rel="stylesheet" href="../styles/themes.css"> 
    <link rel="stylesheet" href="themes-module.css">
    <script type="module">
        // 统一使用 Tauri convertFileSrc，开发和生产环境使用相同逻辑
        (async () => {
            try {
                const mod = await import('@tauri-apps/api/core');
                if (mod && typeof mod.convertFileSrc === 'function') {
                    window.convertFileSrc = mod.convertFileSrc;
                }
            } catch (e) {
                console.warn('convertFileSrc not available via @tauri-apps/api/core in themes window:', e);
            }
            // Provide a resilient fallback when convertFileSrc is not available
            if (typeof window.convertFileSrc !== 'function') {
                window.convertFileSrc = function (p) {
                    try {
                        if (!p) return p;
                        // passthrough for already-valid URLs
                        if (/^file:|^https?:\/\/|^asset:\/\/|^blob:|^data:/.test(p)) return p;
                        // normalize backslashes -> forward slashes
                        let np = String(p).replace(/\\/g, '/');
                        // Windows absolute path like C:/...
                        if (/^[A-Za-z]:\//.test(np) || /^\/[A-Za-z]:\//.test(np)) {
                            np = np.replace(/^\/+/, '');
                            return `file://${np}`;
                        }
                        // relative path - return as-is (will be resolved by other means)
                        return np;
                    } catch (e) {
                        return p;
                    }
                };
            }
        })();
    </script>
</head>
<body>
    <!-- Custom Title Bar -->
    <div id="custom-title-bar">
        <div class="title">VCP - 主题选择</div>
        <div class="window-controls">
            <button id="minimize-theme-btn" class="window-control-btn" title="最小化">
                <svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="1.2"></line></svg>
            </button>
            <button id="maximize-theme-btn" class="window-control-btn" title="最大化">
                <svg width="10" height="10" viewBox="0 0 10 10"><path fill="none" stroke="currentColor" stroke-width="1" d="M0.5,0.5 h9 v9 h-9 z"></path></svg>
            </button>
            <button id="close-theme-btn" class="window-control-btn" title="关闭">
                <svg width="10" height="10" viewBox="0 0 10 10"><path fill="currentColor" d="M0.5,0.5 9.5,9.5 M9.5,0.5 0.5,9.5" stroke="currentColor" stroke-width="1.2"></path></svg>
            </button>
        </div>
    </div>
    <div class="container">
        <h1>选择您的主题</h1>
        <div class="themes-grid" id="themesGrid">
            <!-- Theme cards will be dynamically generated by JS -->
        </div>
        <div class="theme-preview">
            <h2>实时预览</h2>
            <div class="preview-box" id="previewBox">
                <!-- Left Pane (Simulates Sidebar/Panels with Dark Wallpaper) -->
                <div class="preview-pane" id="preview-pane-1">
                    <div class="preview-wallpaper-bg" id="preview-wallpaper-1"></div>
                    <div class="mock-title"></div>
                    <div class="mock-text"></div>
                    <div class="mock-text"></div>
                    <!-- Buttons for Pane 1 (Dark Theme) -->
                    <div class="preview-button-container" id="preview-buttons-1">
                        <button class="preview-button">按钮</button>
                        <button class="preview-button alt">按钮</button>
                    </div>
                </div>
                <!-- Right Pane (Simulates Main Content Area with Light Wallpaper) -->
                <div class="preview-pane" id="preview-pane-2">
                    <div class="preview-wallpaper-bg" id="preview-wallpaper-2"></div>
                    <div class="mock-title"></div>
                    <div class="mock-text"></div>
                    <div class="mock-text"></div>
                    <div class="mock-text"></div>
                    <!-- Buttons for Pane 2 (Light Theme) -->
                    <div class="preview-button-container" id="preview-buttons-2">
                        <button class="preview-button">按钮</button>
                        <button class="preview-button alt">按钮</button>
                    </div>
                </div>
        </div>
        <button id="saveThemeBtn" class="save-button">应用并刷新</button>
    </div>
    <script src="themes.js"></script>
</body>
</html>
    <script type="module" src="../tauri_compat.js"></script>
